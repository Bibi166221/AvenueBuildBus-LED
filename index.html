        /**
         * Stop Component

         */
        function Stop({ stop, position, isNext, isPassed, opacity = 1, fadeDuration = 400 }) {
            // Position: 0 = bottom (current), 1 = middle, 2 = top
            const configs = [
                {
                    // (0) Exit position (Off-screen bottom)

                {

                    textClass: 'top-[58%] left-[26%] sm:left-[34%]',

                    subColor: 'text-gray-700',

                },
                {

                    textClass: 'top-[42%] left-[22%] sm:left-[30%]',
                    dotSize: 'w-28 h-28',
                    dotBorder: 'border-2',
                    textSize: 'text-5xl sm:text-6xl',
                    subSize: 'text-4xl sm:text-5xl',
                    textColor: 'text-gray-800',
                    subColor: 'text-gray-600',
                    shadow: 'shadow-lg'
                },

                    // (3) Top position (FUTURE STOP)

                    textClass: 'top-[21%] left-[12%] sm:left-[25%]',
                    dotSize: 'w-28 h-28',
                    dotBorder: 'border-2',
                    textSize: 'text-5xl sm:text-6xl',

                    subColor: 'text-gray-600',

                },

                    dotClass: 'top-[-10%] left-[-2%] sm:left-[7%]',
                    textClass: 'top-[-10%] left-[7%] sm:left-[20%]',

                    subColor: 'text-gray-600',

                }
            ];

            const config = configs[position] || configs[1];
            // Position 1 is current stop, should be on top
            const zIndex = position === 1 ? 'z-40' : (position === 2 ? 'z-30' : 'z-20');

            return (

        /**
         * RouteVisualization Component
         * Displays scrolling stops that slide down as bus progresses
         */
        function RouteVisualization({ stops = [] }) {
            const [displayData, setDisplayData] = React.useState([]);
            const [prevStops, setPrevStops] = React.useState([]);
            const isAnimating = React.useRef(false);

            // Helper to get current visible stops with keys
            const getVisibleWithKeys = (arr) => {
                const currentIdx = arr.findIndex(s => s.isNext);
                const startIndex = currentIdx >= 0 ? currentIdx : 0;
                const visible = [];
                for (let i = 0; i < 3; i++) {
                    const stop = arr[startIndex + i];
                    if (stop) {
                        visible.push({ stop, key: stop.stopName });
                    } else {
                        visible.push({ stop: { stopName: "...", stopNameTH: "..." }, key: `filler-${startIndex + i}` });
                    }
                }
                return visible;
            };

            // Initialize display data
            React.useEffect(() => {
                const visible = getVisibleWithKeys(stops);
                setDisplayData(visible.map((v, i) => ({ ...v, position: i + 1, opacity: 1 })));
                setPrevStops(stops);
            }, []);

            // Handle updates with choreography or instant refresh
            React.useEffect(() => {
                if (prevStops.length > 0 && JSON.stringify(stops) !== JSON.stringify(prevStops)) {
                    if (isAnimating.current) return;

                    const nextVisible = getVisibleWithKeys(stops);
                    const currentVisible = displayData.map(d => d.stop);

                    // Check if it's a 1-stop sequential move
                    // sequential if nextVisible[0] was previously at position 1 (which is index 1 in displayData)
                    const isSequential = currentVisible[1] &&
                        currentVisible[1].stopName.trim() === nextVisible[0].stop.stopName.trim();

                    if (isSequential) {
                        animateSequential(stops);
                    } else {
                        animateJump(stops);
                    }
                }
            }, [stops]);

            const animateJump = async (newStops) => {
                isAnimating.current = true;
                const nextVisible = getVisibleWithKeys(newStops);

                // Fade out current items
                setDisplayData(prev => prev.map(item => ({ ...item, opacity: 0 })));
                await new Promise(r => setTimeout(r, 400));

                // Swap and fade in
                setDisplayData(nextVisible.map((v, i) => ({ ...v, position: i + 1, opacity: 1 })));
                await new Promise(r => setTimeout(r, 600));

                setPrevStops(newStops);
                isAnimating.current = false;
            };

            const animateSequential = async (newStops) => {
                const nextVisible = getVisibleWithKeys(newStops);
                const currentData = [...displayData].slice(0, 4); // Handle case where previous animation didn't clean up

                if (currentData.length < 3) {
                    animateJump(newStops);
                    return;
                }

                isAnimating.current = true;

                // Sync the DATA part of our items with the NEW stops immediately
                // This ensures the "Glow" (isNext) and "Passed" states update AS they move
                const items = [
                    { ...currentData[0], opacity: 1 },                   // The one exiting (old bottom)
                    { ...nextVisible[0], opacity: 1 },                   // The one becoming bottom (new isNext)
                    { ...nextVisible[1], opacity: 1 },                   // The one becoming middle
                    { ...nextVisible[2], opacity: 0, fadeDuration: 100 } // The one entering top (hidden)
                ];

                // Step 0: Mount Entrance Item at pos 4 (Wait 100ms for stable render)
                setDisplayData([
                    { ...items[0], position: 1, opacity: 1 },
                    { ...items[1], position: 2, opacity: 1 },
                    { ...items[2], position: 3, opacity: 1 },
                    { ...items[3], position: 4, opacity: 0 }
                ]);
                await new Promise(r => setTimeout(r, 100));

                // Step 1: Slide ONLY current stop OUT (1 -> 0)
                setDisplayData([
                    { ...items[0], position: 0, opacity: 0, fadeDuration: 800 }, // Exit
                    { ...items[1], position: 2, opacity: 1 },                   // Wait
                    { ...items[2], position: 3, opacity: 1 },                   // Wait
                    { ...items[3], position: 4, opacity: 0 }                    // Wait
                ]);
                await new Promise(r => setTimeout(r, 600));

                // Step 2: Slide new CURRENT stop IN (2 -> 1) - THE LEAD MOVE
                setDisplayData([
                    { ...items[0], position: 0, opacity: 0 },
                    { ...items[1], position: 1, opacity: 1 },                   // Move to current
                    { ...items[2], position: 3, opacity: 1 },                   // Wait
                    { ...items[3], position: 4, opacity: 0 }                    // Wait
                ]);
                // Give the main arrival more space to finish smoothly
                await new Promise(r => setTimeout(r, 800));

                // Step 3: Slide NEXT stop down (3 -> 2)
                setDisplayData([
                    { ...items[0], position: 0, opacity: 0 },
                    { ...items[1], position: 1, opacity: 1 },
                    { ...items[2], position: 2, opacity: 1 },                   // Move to next
                    { ...items[3], position: 4, opacity: 0 }                    // Wait
                ]);
                await new Promise(r => setTimeout(r, 500));

                // Step 4: Slide FUTURE stop in (4 -> 3)
                setDisplayData([
                    { ...items[0], position: 0, opacity: 0 },
                    { ...items[1], position: 1, opacity: 1 },
                    { ...items[2], position: 2, opacity: 1 },
                    { ...items[3], position: 3, opacity: 1, fadeDuration: 800 } // Fade in/Move to 3
                ]);

                await new Promise(r => setTimeout(r, 1200));

                // Final Clean
                setDisplayData([
                    { ...items[1], position: 1, opacity: 1 },
                    { ...items[2], position: 2, opacity: 1 },
                    { ...items[3], position: 3, opacity: 1 }
                ]);

                setPrevStops(newStops);
                isAnimating.current = false;
            };

            if (displayData.length === 0) return null;

            return (
                <div className="relative w-full flex-grow bg-gray-100 overflow-hidden flex items-center justify-center animate-fade-in">
                    <div className="relative w-full h-full max-w-[1920px]">
                        {/* Red curved route line */}
                        <svg viewBox="0 0 800 500" className="w-full h-full drop-shadow-xl" preserveAspectRatio="xMidYMid slice">
                            <path
                                d="M -604 50 C -94 50, 246 50, 196 550"
                                fill="none"
                                stroke="#da291c"
                                strokeWidth="80"
                                strokeLinecap="round"
                            />
                        </svg>

                        {displayData.map((item) => (
                            <Stop
                                key={item.key}
                                stop={item.stop}
                                position={item.position ?? 0}
                                isNext={item.stop.isNext}
                                isPassed={item.stop.isPassed}
                                opacity={item.opacity}
                                fadeDuration={item.fadeDuration}
                            />
                        ))}
                    </div>
                </div>
            );
        }

        /**
         * SlidingText Component
         * Handles vertical rolling transition for text
         */
        function SlidingText({ text, className }) {
            const [displayText, setDisplayText] = useState(text);
            const [slideState, setSlideState] = useState('active'); // 'active', 'slide-out'
            const [nextText, setNextText] = useState('');

            useEffect(() => {
                if (text !== displayText && slideState === 'active') {
                    setNextText(text);
                    setSlideState('slide-out');
                    setTimeout(() => {
                        setDisplayText(text);
                        setSlideState('active');
                        setNextText('');
                    }, 600);
                }
            }, [text]);

            return (
                <div className={`relative overflow-hidden h-full flex items-center ${className}`}>
                    <div
                        className={`transition-all duration-500 ease-in-out transform ${slideState === 'slide-out' ? 'translate-y-full opacity-0' : 'translate-y-0 opacity-1'
                            }`}
                    >
                        {displayText}
                    </div>
                    {slideState === 'slide-out' && (
                        <div
                            className="absolute inset-0 flex items-center translate-y-[-100%] animate-[slideInDown_0.5s_ease-out_forwards]"
                        >
                            {nextText}
                        </div>
                    )}
                </div>
            );
        }

        // --- GPS CONFIGURATION & UTILS ---
        const GPS_STOPS = [
            // Stop 1:  (Corrected Longitude to 100 based on context/proximity)
            { id: 1, name: "Bus Stop 1", nameTH: "ป้ายที่ 1", lat: 13.913360, lng: 100.556458 },
            // Stop 2: 
            { id: 2, name: "Bus Stop 2", nameTH: "ป้ายที่ 2", lat: 13.913750, lng: 100.555917 },
            // Stop 3: 
            { id: 3, name: "Bus Stop 3", nameTH: "ป้ายที่ 3", lat: 13.913250, lng: 100.555750 }
        ];

        const GPS_WARNINGS = [
            { id: 101, name: "TURN LEFT", lat: 13.9135, lng: 100.5558, radius: 0.03 }, // 30m radius
            { id: 102, name: "TURN LEFT", lat: 13.9125, lng: 100.5552, radius: 0.03 },
            { id: 103, name: "TURN LEFT", lat: 13.9115, lng: 100.5545, radius: 0.03 }
        ];

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            var R = 6371; // Radius of the earth in km
            var dLat = deg2rad(lat2 - lat1);
            var dLon = deg2rad(lon2 - lon1);
            var a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            var d = R * c; // Distance in km
            return d;
        }

        function deg2rad(deg) {
            return deg * (Math.PI / 180);
        }

        function getClosestStop(lat, lng) {
            if (!lat || !lng) return null;
            let minDist = Infinity;
            let closest = null;
            let index = -1;

            GPS_STOPS.forEach((stop, i) => {
                const d = getDistanceFromLatLonInKm(lat, lng, stop.lat, stop.lng);
                if (d < minDist) {
                    minDist = d;
                    closest = stop;
                    index = i;
                }
            });

            return { stop: closest, index, distance: minDist };
        }

        function getClosestWarning(lat, lng) {
            if (!lat || !lng) return null;
            for (const warning of GPS_WARNINGS) {
                const d = getDistanceFromLatLonInKm(lat, lng, warning.lat, warning.lng);
                if (d <= warning.radius) {
                    return warning;
                }
            }
            return null;
        }

        /**
         * BusCard Component
         * Handles layout, animations, and VOICE ANNOUNCEMENTS
         */
        function BusCard({ busId, data }) {
            const busNum = data?.busNumber || busId;
            const busSuffix = data?.busNumberSuffix || "";
            const destination = data?.destination || "Unknown";
            const destinationTH = data?.destinationTH || "";

            // --- STATE DECLARATIONS ---
            const [hasInteracted, setHasInteracted] = useState(false);
            const [lastAnnouncedStop, setLastAnnouncedStop] = useState(null);
            const [lastAnnouncedWarning, setLastAnnouncedWarning] = useState(null);
            const [isDemoMode, setIsDemoMode] = useState(false);

            // --- AUDIO CONFIG ---
            const audioConfig = {
                chimeStr: "/sounds/chime1.mp3",
                defaultStop: "/sounds/stops/default_next_stop.mp3",
                stops: {
                    "Active Square": "/sounds/stops/active_square.mp3",
                    "Cosmo Bazaar": "/sounds/stops/cosmo_bazaar.mp3",
                    "Kasikornthai Bank": "/sounds/stops/kasikorn_bank.mp3",
                    "Opp. Wat Phasuk": "/sounds/stops/opp_watphasuk.mp3",
                    "Sukhothai Univ.": "/sounds/stops/sukhotai_univ.mp3"
                },
                warnings: {
                    "TURN LEFT": "/sounds/turn_warning.mp3", // Custom turn MP3
                    "TURN RIGHT": "/sounds/turn_warning.mp3",
                    "HOLD ON": "/sounds/hold_on.mp3"
                }
            };

            // --- GPS Debug ---
            const gpsLat = data?.gps_lat;
            const gpsLng = data?.gps_lng;
            const speed = data?.speed;

            // --- GPS LOGIC ---
            // Calculate current stop based on GPS info
            const gpsInfo = useMemo(() => isDemoMode ? null : getClosestStop(gpsLat, gpsLng), [isDemoMode, gpsLat, gpsLng]);

            // Logic for "Next Stop" display:
            // 1. If we are within 50m of stop[i], the "Next" stop is actually the one *after* (i+1).
            // 2. If we are moving between stops and closest is [i], then [i] is the "Next" stop.
            const calculatedTarget = useMemo(() => {
                if (!gpsInfo) return null;
                const { index, distance } = gpsInfo;

                // If we are AT the stop (less than 50m), show the NEXT one in line
                if (distance >= 0.05) {
                    const nextIdx = Math.min(index + 1, GPS_STOPS.length - 1);
                    return GPS_STOPS[nextIdx];
                }
                return GPS_STOPS[index];
            }, [gpsInfo]);

            // Determine Target Stop (Prefer GPS, fallback to Database)
            const targetStop = calculatedTarget ? calculatedTarget.name : (data?.targetStopName || "Please Wait");
            const targetStopTH = calculatedTarget ? calculatedTarget.nameTH : (data?.targetStopNameTH || "");

            // Determine Next Stops
            // If we found a GPS stop, we generate the list of *subsequent* stops
            const rawStops = useMemo(() => {
                if (calculatedTarget) {
                    const currentIndex = GPS_STOPS.findIndex(s => s.name === calculatedTarget.name);
                    if (currentIndex !== -1) {
                        return GPS_STOPS.map((s, idx) => ({
                            stopName: s.name,
                            stopNameTH: s.nameTH,
                            isNext: idx === currentIndex,
                            isPassed: idx < currentIndex
                        }));
                    }
                }
                return data?.nextStops || [];
            }, [calculatedTarget, data?.nextStops]);


            // --- EFFECT: AUDIO SYSTEM (Chime -> Voice) ---
            useEffect(() => {
                if (!hasInteracted || !targetStop || targetStop === "Please Wait") return;

                // Prevent repeat
                if (targetStop === lastAnnouncedStop) return;

                // 1. Play Chime
                const chime = new Audio(audioConfig.chimeStr);

                chime.onended = () => {
                    // 2. Play Voice when chime ends
                    // Robust lookup: search keys ignoring case and leading/trailing spaces
                    const targetKey = targetStop.trim().toLowerCase();
                    const matchedKey = Object.keys(audioConfig.stops).find(k => k.trim().toLowerCase() === targetKey);

                    const voiceFile = matchedKey ? audioConfig.stops[matchedKey] : audioConfig.defaultStop;

                    console.log(`[Audio] Announcing: "${targetStop}" -> ${voiceFile}`);

                    const voice = new Audio(voiceFile);
                    voice.play().catch(e => console.error("Voice Play Error:", e));
                };

                chime.play().catch(e => console.error("Chime Error:", e));

                setLastAnnouncedStop(targetStop);

            }, [targetStop, targetStopTH, hasInteracted, lastAnnouncedStop]);


            // --- EFFECT: GPS WARNING SYSTEM ---
            const gpsWarning = useMemo(() => getClosestWarning(gpsLat, gpsLng), [gpsLat, gpsLng]);
            const currentWarning = gpsWarning ? gpsWarning.name : "";

            useEffect(() => {
                if (!hasInteracted || !currentWarning || currentWarning === lastAnnouncedWarning) return;

                const warningKey = currentWarning.trim().toUpperCase();
                const voiceFile = audioConfig.warnings[warningKey] || audioConfig.defaultStop;

                // If it's a TURN warning, play immediately WITHOUT chime
                if (warningKey.includes("TURN")) {
                    console.log(`[Audio GPS] Turn Warning (No Chime): "${currentWarning}" -> ${voiceFile}`);
                    const voice = new Audio(voiceFile);
                    voice.play().catch(e => console.error("Turn Voice Play Error:", e));
                } else {
                    // Otherwise, play chime then voice
                    console.log(`[Audio GPS] Warning Triggered: "${currentWarning}" (Playing Chime first)`);
                    const chime = new Audio(audioConfig.chimeStr);
                    chime.onended = () => {
                        const voice = new Audio(voiceFile);
                        voice.play().catch(e => console.error("Warning Voice Play Error:", e));
                    };
                    chime.play().catch(e => console.error("Chime Error:", e));
                }

                setLastAnnouncedWarning(currentWarning);

            }, [currentWarning, hasInteracted, lastAnnouncedWarning]);


            // --- AUDIO ENABLE OVERLAY ---
            if (!hasInteracted) {
                return (
                    <div
                        className="fixed inset-0 z-[100] bg-black/80 flex flex-col items-center justify-center cursor-pointer animate-fade-in"
                        onClick={() => {
                            setHasInteracted(true);
                            // Verify audio context unlocked
                            const silent = new Audio(audioConfig.chimeStr);
                            silent.volume = 0;
                            silent.play().catch(() => { });
                        }}
                    >
                        <div className="bg-white p-8 rounded-xl shadow-2xl text-center max-w-md mx-4">
                            <h1 className="text-4xl font-bold mb-4 text-black">Click to Start</h1>
                            <p className="text-xl text-gray-600 mb-6">Enable Audio Announcements & Fullscreen</p>
                            <button className="bg-blue-600 text-white px-8 py-3 rounded-full text-lg font-bold animate-bounce">
                                TAP ANYWHERE
                            </button>
                        </div>
                    </div>
                );
            }



            return (
                <div className="w-full h-full flex flex-col bg-gray-100 overflow-hidden relative">

                    {/* --- MODE TOGGLE BUTTON --- */}
                    <div className="absolute bottom-2 right-2 z-[70] flex flex-col gap-2 items-end pointer-events-auto">
                        <button
                            onClick={() => setIsDemoMode(!isDemoMode)}
                            className={`px-4 py-2 rounded-lg font-bold shadow-lg text-sm transition-all ${isDemoMode ? 'bg-blue-600 text-white animate-pulse' : 'bg-gray-800 text-gray-400'}`}
                        >
                            {isDemoMode ? "🛠 DEMO MODE ON" : "📡 GPS MODE ON"}
                        </button>
                    </div>

                    {/* --- GPS DEBUG OVERLAY --- */}
                    {(gpsLat || gpsLng) && (
                        <div className={`absolute bottom-2 left-2 z-[60] bg-black/70 text-green-400 p-2 font-mono text-xs rounded pointer-events-none transition-opacity ${isDemoMode ? 'opacity-30' : 'opacity-100'}`}>
                            <div>GPS LIVE:</div>
                            <div>Lat: {Number(gpsLat).toFixed(6)}</div>
                            <div>Lng: {Number(gpsLng).toFixed(6)}</div>
                            {speed && <div>Spd: {speed} km/h</div>}
                        </div>
                    )}










                    {/* Header Bar - Fixed Height, Flex Layout (No Absolutes) */}
                    <div className="flex flex-col md:flex-row bg-[#e5e7eb] border-b-[6px] border-white shrink-0 z-40 shadow-sm min-h-[140px]">

                        {/* 1. This Stop (Red) - REMOVED animate-blink */}
                        <div className="bg-[#da291c] text-white p-4 md:p-6 min-w-[220px] lg:min-w-[280px] flex flex-col justify-center text-center md:text-left">
                            <h2 className="text-3xl md:text-5xl font-semibold leading-none">ป้ายต่อไป</h2>
                            <h2 className="text-xl md:text-2xl font-light mt-1">Next stop:</h2>
                        </div>

                        {/* 2. Stop Name (Center, Flex Grow) - ADDED animate-flash-once logic via key */}
                        <div key={targetStop} className="flex-1 p-4 md:p-6 flex flex-col justify-center pl-4 md:pl-8 border-t md:border-t-0 md:border-r border-white/50 h-[140px] animate-flash-once">
                            <div className="text-4xl md:text-6xl font-bold text-black mb-1 tracking-tight leading-tight">
                                {targetStopTH}
                            </div>
                            <div className="text-2xl md:text-3xl font-medium text-gray-700">
                                {targetStop}
                            </div>
                        </div>

                        {/* 3. Right Side: Destination + Badge (Flex Row) */}
                        <div className="flex flex-row bg-gray-200/50">

                            {/* Destination Text */}
                            <div className="p-4 md:p-6 flex flex-col justify-center text-right min-w-[300px] lg:min-w-[450px]">
                                <span className="block text-3xl md:text-5xl font-bold mb-1 text-gray-800">ปลายทาง: {destinationTH}</span>
                                <span className="block text-2xl md:text-4xl text-gray-600">Towards: {destination}</span>
                            </div>

                            {/* Badge (Red Block) */}
                            <div className="bg-[#da291c] text-white w-32 md:w-36 flex flex-col items-center justify-center shadow-lg">
                                <span className="text-5xl md:text-6xl font-bold tracking-tighter">{busNum}</span>
                                <span className="text-xl font-medium">{busSuffix}</span>
                            </div>
                        </div>

                    </div>

                    {/* Body fills remaining space */}
                    <RouteVisualization stops={rawStops} />
                </div>
            );
        }

        // --- MAIN APP ---
        function App() {
            const [liveBuses, setLiveBuses] = useState([]);
            const [status, setStatus] = useState("Connecting...");

            // New state for announcements
            const [announcement, setAnnouncement] = useState({
                text: "WELCOME TO AVENUE BUILD BUS",
                isEmergency: false
            });

            useEffect(() => {
                if (!isFirebaseConfigured || !db) return;
                const path = `/artifacts/${ENV_APP_ID}/public/data/bus-status`;
                onSnapshot(collection(db, path), (snapshot) => {
                    const buses = [];
                    snapshot.forEach(doc => buses.push({ id: doc.id, data: doc.data() }));
                    buses.sort((a, b) => (a.data.estimatedTimeSeconds || 0) - (b.data.estimatedTimeSeconds || 0));
                    setLiveBuses(buses);
                });
            }, []);

            // Listen for announcements from second Firebase
            useEffect(() => {
                if (!announceDb) return;

                const announceRef = collection(announceDb, 'announcements');
                const unsubscribe = onSnapshot(announceRef, (snapshot) => {
                    if (!snapshot.empty) {
                        const data = snapshot.docs[0].data();
                        setAnnouncement({
                            text: (data.text || data.message || "SYSTEM ACTIVE").toUpperCase(),
                            isEmergency: data.type === 'door' || data.isEmergency || data.status === 'open'
                        });
                    }
                });
                return () => unsubscribe();
            }, []);

            return (
                <div className="w-full h-screen flex flex-col bg-white text-gray-900 overflow-hidden">
                    {/* TOP SECTION: VIDEO + LED (40% H) */}
                    <VideoZone
                        announcementText={liveBuses[0]?.data?.warning || (getClosestWarning(liveBuses[0]?.data?.gps_lat, liveBuses[0]?.data?.gps_lng)?.name) || announcement.text}
                        isEmergency={(liveBuses[0]?.data?.warning || getClosestWarning(liveBuses[0]?.data?.gps_lat, liveBuses[0]?.data?.gps_lng)) ? true : announcement.isEmergency}
                    />

                    {/* BOTTOM SECTION: BUS INFO (Remaining H) */}
                    <div className="flex-grow relative w-full overflow-hidden">
                        {liveBuses.length > 0 ? (
                            <BusCard busId={liveBuses[0].id} data={liveBuses[0].data} />
                        ) : (
                            <div className="w-full h-full flex flex-col items-center justify-center bg-gray-100 text-gray-400">
                                <h1 className="text-3xl font-light mb-2">Connecting...</h1>
                                <p className="text-xs">Path: /artifacts/{ENV_APP_ID}/public/data/bus-status</p>
                            </div>
                        )}
                        <div className="absolute bottom-0 right-0 bg-red-500 text-white text-xs p-1 z-[100]">
                            DEBUG: {liveBuses.length} buses. Path: /artifacts/{ENV_APP_ID}/public/data/bus-status
                        </div>
                    </div>
                </div>
            );
        }

        // Mount
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>

</html>
